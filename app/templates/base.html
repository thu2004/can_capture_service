<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}CAN Capture Service{% endblock %}</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block extra_head %}{% endblock %}
</head>
<body>
    <div class="wrapper">
        <!-- Sidebar Overlay (mobile only) -->
        <div id="sidebarOverlay" class="sidebar-overlay"></div>
        
        <!-- Sidebar -->
        <nav id="sidebar" class="sidebar">
            <div class="sidebar-header">
                <h3>CAN Capture</h3>
                <button type="button" id="sidebarCollapse" class="btn btn-sm btn-outline-secondary d-lg-none">
                    <span>☰</span>
                </button>
            </div>
            <ul class="list-unstyled components">
                <li>
                    <a href="{{ url_for('web.api_docs') }}" class="nav-link">
                        <span class="nav-icon">📚</span>
                        <span class="nav-text">API Docs</span>
                    </a>
                </li>
                <li>
                    <a href="{{ url_for('web.capture') }}" class="nav-link">
                        <span class="nav-icon">🎬</span>
                        <span class="nav-text">Capture</span>
                    </a>
                </li>
                <li>
                    <a href="{{ url_for('web.index') }}" class="nav-link">
                        <span class="nav-icon">📊</span>
                        <span class="nav-text">Dashboard</span>
                    </a>
                </li>
                <li>
                    <a href="{{ url_for('web.files') }}" class="nav-link">
                        <span class="nav-icon">📁</span>
                        <span class="nav-text">Files</span>
                    </a>
                </li>
                <li>
                    <a href="{{ url_for('web.interfaces') }}" class="nav-link">
                        <span class="nav-icon">🔌</span>
                        <span class="nav-text">Interfaces</span>
                    </a>
                </li>
                <li>
                    <a href="{{ url_for('web.logs') }}" class="nav-link">
                        <span class="nav-icon">📋</span>
                        <span class="nav-text">Logs</span>
                    </a>
                </li>
            </ul>
            <div class="sidebar-footer">
                <p class="text-muted small mb-0">CAN Capture Service</p>
                <p class="text-muted small mb-0">&copy; 2026 MIT License</p>
            </div>
        </nav>

        <!-- Page Content -->
        <div id="content" class="content">
            <!-- Mobile Menu Toggle -->
            <button type="button" id="mobileMenuToggle" class="btn btn-primary d-lg-none mobile-menu-toggle">
                <span>☰</span> Menu
            </button>
            
            <!-- Main Content -->
            <main class="container-fluid py-4">
                {% block content %}{% endblock %}
            </main>

            <!-- Footer -->
            <footer class="footer py-3">
                <div class="container-fluid text-center">
                    <p class="text-muted mb-0">CAN Capture Service &copy; 2026 - MIT License</p>
                </div>
            </footer>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
